[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-stock-report"
version = "0.1.0"
description = "上市籌碼報告與本機桌面小工具"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
stock-report = "stock_report.cli:main"

[tool.setuptools.packages.find]
include = ["stock_report*"]
